<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지우개 따먹기</title>
<style>
  :root { --ink: #2c2420; --paper: #fffaf1; --line: #e3d6c2; --p: #2f7fe0; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfc4b3; }
  body { font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; color: var(--ink); font-size: 14px; }
  #app, #app canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .chip { position: fixed; z-index: 5; background: var(--paper); border: 2px solid var(--line); border-radius: 14px; padding: 8px 14px; box-shadow: 0 3px 0 rgba(60, 40, 20, .12); }
  #turn { left: 14px; top: 14px; font-weight: 800; font-size: 17px; display: flex; align-items: center; gap: 9px; }
  #turn i { width: 16px; height: 16px; border-radius: 5px; background: var(--p); display: block; }
  #status { left: 50%; top: 14px; transform: translateX(-50%); font-weight: 700; text-align: center; max-width: min(60vw, 520px); }
  #status small { display: block; font-weight: 600; color: #8a7765; font-size: 12px; }
  #devBtn { right: 14px; top: 14px; cursor: pointer; font: inherit; font-weight: 700; }
  #bar { left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; width: max-content; max-width: calc(100vw - 28px); box-sizing: border-box; }
  button { font: inherit; font-weight: 800; color: var(--ink); background: #fff; border: 2px solid var(--line); border-radius: 11px; padding: 9px 13px; cursor: pointer; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  button:active { transform: translateY(1px); }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid #ffb84a; outline-offset: 1px; }
  button:disabled { opacity: .4; cursor: default; }
  #fire { background: var(--p); border-color: transparent; color: #fff; min-width: 128px; font-size: 16px; padding: 11px 18px; }
  #gauge { width: min(34vw, 260px); height: 22px; border-radius: 11px; background: #efe5d5; border: 2px solid var(--line); position: relative; overflow: hidden; }
  #gauge i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, #7fd36b, #ffd24a 55%, #ff5a4a); }
  #gauge b { position: absolute; right: 8px; top: 0; line-height: 22px; font-size: 12px; font-weight: 800; }
  #keys { width: 100%; text-align: center; font-size: 12px; color: #8a7765; font-weight: 600; }
  kbd { font: inherit; font-weight: 800; background: #f1e7d6; border-radius: 5px; padding: 0 6px; color: var(--ink); }
  #result { left: 50%; top: 84px; transform: translateX(-50%); text-align: center; padding: 14px 22px; border-width: 3px; }
  #result h2 { margin: 0 0 2px; font-size: 22px; }
  #result p { margin: 0 0 10px; color: #6d5c4d; font-weight: 600; }
  #retry { left: 50%; top: 84px; transform: translateX(-50%); text-align: center; }
  body.dev-open #status, body.dev-open #bar, body.dev-open #result, body.dev-open #retry { left: calc((100vw - min(380px, 100vw)) / 2); }
  body.dev-open #bar { max-width: calc(100vw - min(380px, 100vw) - 28px); }
  [hidden] { display: none !important; }

  #dev { position: fixed; z-index: 8; right: 0; top: 0; bottom: 0; width: min(380px, 100vw); background: var(--paper); border-left: 2px solid var(--line); overflow-y: auto; padding: 12px 14px 30px; box-sizing: border-box; font-size: 13px; }
  #dev h3 { margin: 16px 0 6px; font-size: 14px; border-bottom: 2px solid var(--line); padding-bottom: 4px; }
  #dev h3:first-of-type { margin-top: 4px; }
  #dev .head { display: flex; justify-content: space-between; align-items: center; }
  #dev .row { display: grid; grid-template-columns: 1fr 78px; gap: 2px 8px; padding: 5px 0; border-bottom: 1px dashed var(--line); }
  #dev .row label { font-weight: 700; }
  #dev .row small { grid-column: 1 / -1; color: #8a7765; }
  #dev .row.changed label::after { content: " · 다음 발사부터"; color: #d9602f; font-weight: 700; }
  #dev .row .now { color: #8a7765; font-size: 11px; grid-column: 1 / -1; }
  #dev input[type=number] { width: 100%; box-sizing: border-box; font: inherit; padding: 4px 6px; border: 2px solid var(--line); border-radius: 7px; background: #fff; }
  #dev input.bad { border-color: #e0483a; background: #fff0ee; }
  #dev .btns { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  #dev .btns button { padding: 6px 9px; font-size: 12px; }
  #dev textarea { width: 100%; height: 84px; box-sizing: border-box; font: 11px/1.4 ui-monospace, Menlo, Consolas, monospace; border: 2px solid var(--line); border-radius: 7px; }
  #dev .err { color: #c7392c; font-weight: 700; white-space: pre-wrap; }
  #dev .ok { color: #2f8f4e; font-weight: 700; }
  #dev pre { background: #f4ecde; border-radius: 8px; padding: 8px; margin: 6px 0 0; font: 11px/1.5 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; }
  #dev .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  #dev .two label { font-weight: 700; display: block; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; z-index: 9; background: #cfc4b3; font-weight: 800; font-size: 16px; }
</style>
</head>
<body>
<div id="app"></div>
<div class="chip" id="turn"><i></i><span id="turnText">1P 차례</span></div>
<div class="chip" id="status"><span id="statusText">방향을 정하세요</span><small id="statusSub"></small></div>
<button class="chip" id="devBtn" aria-expanded="false">개발자 패널</button>

<div class="chip" id="result" hidden>
  <h2 id="resultTitle"></h2><p id="resultWhy"></p>
  <button id="again">다시 시작</button>
</div>
<div class="chip" id="retry" hidden>
  <p style="margin:0 0 8px;font-weight:700">지우개가 멈추지 않습니다.</p>
  <button id="retryBtn">이번 차례 다시 하기</button>
</div>

<div class="chip" id="bar">
  <button id="left" aria-label="방향 왼쪽으로">◀</button>
  <div id="gauge" role="progressbar" aria-label="파워" aria-valuemin="0" aria-valuemax="100"><i id="gaugeFill"></i><b id="gaugeNum"></b></div>
  <button id="right" aria-label="방향 오른쪽으로">▶</button>
  <button id="fire">게이지 시작</button>
  <div id="keys"><kbd>←</kbd><kbd>→</kbd> 또는 <kbd>A</kbd><kbd>D</kbd> 방향 · <kbd>Space</kbd> 게이지 시작 / 튕기기 · <kbd>R</kbd> 다시 시작</div>
</div>

<aside id="dev" hidden></aside>
<div id="loading">책상을 차리는 중…</div>
<script>/*BUNDLE*/</script>
</body>
</html>
